<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Huerto - Acceso</title>
    <style>
        /* Estructura general de pantalla dividida al 100% */
        body { 
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            background-color: #ffffff;
            color: #2e3b27;
        }

        .instagram-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* MITAD IZQUIERDA: Tu ilustración original abarcando todo el espacio */
        .panel-image {
            flex: 1.2; 
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
        }

        .panel-image img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        /* MITAD DERECHA: Zona de acceso */
        .panel-form {
            flex: 0.9; 
            background-color: #ffffff; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
            border-left: 1px solid rgba(182, 196, 177, 0.3);
        }

        /* Tarjeta con fondo verde oliva ultra suave que combina con la tortuga */
        .form-card {
            background-color: #f3f6f2; 
            border: 1px solid #dbe3da;
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(78, 107, 59, 0.04);
            text-align: center;
        }

        /* Títulos estilizados en base a la tortuga */
        .brand-title {
            color: #3b522c; 
            font-size: 2.3rem;
            margin-top: 0;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .brand-subtitle {
            color: #5c7050; 
            font-size: 0.92rem;
            font-weight: 600;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        /* Inputs integrados con el fondo crema/verde */
        input { 
            width: 100%; 
            margin-bottom: 14px; 
            padding: 13px 12px; 
            border: 1px solid #c0cca9;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.88rem;
            background-color: #ffffff; 
            color: #2e3b27;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: #4d693f; 
            box-shadow: 0 0 6px rgba(77, 105, 63, 0.2);
        }

        /* Botón principal en color Verde Caparazón Profundo */
        button { 
            width: 100%; 
            padding: 13px; 
            cursor: pointer; 
            background: #4d693f; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 8px;
            margin-bottom: 20px;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(77, 105, 63, 0.25);
        }

        button:hover { 
            background: #3a502f; 
        }

        /* Interruptor inferior de vista */
        .switch-form {
            border-top: 1px solid #d2ded0;
            padding-top: 15px;
            font-size: 0.85rem;
            color: #5c7050;
        }

        .switch-link {
            color: #4d693f;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            margin-left: 3px;
        }

        .switch-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        /* Soporte responsivo para móviles */
        @media (max-width: 768px) {
            .panel-image {
                display: none;
            }
            .panel-form {
                flex: 1;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="instagram-layout">
        
        <div class="panel-image">
            <img src="/sorpresa.png?v=23" alt="Proyecto PAEC">
        </div>
        
        <div class="panel-form">
            <div class="form-card">
                <div class="brand-title">🌱 Huertito</div>
                <div id="textoSlogan" class="brand-subtitle">Regístrate para ver las fotos y el progreso de nuestro huerto.</div>

                <div id="formRegistro" autocomplete="off">
                    <input type="text" id="regNombre" placeholder="Nombre completo" autocomplete="off">
                    <input type="email" id="regCorreo" placeholder="Correo electrónico" autocomplete="off">
                    <input type="password" id="regPass" placeholder="Contraseña" autocomplete="new-password">
                    <button onclick="registrar()">Registrarte</button>
                    
                    <div class="switch-form">
                        ¿Tienes una cuenta? <span class="switch-link" onclick="mostrarLogin()">Iniciar sesión</span>
                    </div>
                </div>

                <div id="formLogin" class="hidden" autocomplete="off">
                    <input type="email" id="loginCorreo" placeholder="Correo electrónico" autocomplete="username">
                    <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
                    <button onclick="login()">Entrar</button>
                    
                    <div class="switch-form">
                        ¿No tienes una cuenta? <span class="switch-link" onclick="mostrarRegistro()">Regístrate</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function mostrarLogin() {
            document.getElementById('formRegistro').classList.add('hidden');
            document.getElementById('formLogin').classList.remove('hidden');
            document.getElementById('textoSlogan').innerText = 'Ingresa para gestionar y monitorear tus plantas.';
        }

        function mostrarRegistro() {
            document.getElementById('formLogin').classList.add('hidden');
            document.getElementById('formRegistro').classList.remove('hidden');
            document.getElementById('textoSlogan').innerText = 'Regístrate para ver las fotos y el progreso de nuestro huerto.';
        }

        async function registrar() {
            const correoInput = document.getElementById('regCorreo').value;
            const passInput = document.getElementById('regPass').value;
            const data = {
                nombre: document.getElementById('regNombre').value,
                correo: correoInput,
                password: passInput
            };
            const res = await fetch('/api/registro', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            if(res.ok) {
                alert("¡Registrado con éxito! Entrando al huerto...");
                const loginRes = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ correo: correoInput, password: passInput })
                });
                const info = await loginRes.json();
                
                if(info.token) {
                    localStorage.setItem('token', info.token);
                    localStorage.setItem('rol', info.rol); 
                    window.location.href = '/dashboard.html';
                } else {
                    mostrarLogin();
                }
            } else {
                alert("Error al registrar.");
            }
        }

        async function login() {
            const data = {
                correo: document.getElementById('loginCorreo').value,
                password: document.getElementById('loginPass').value
            };
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const info = await res.json();
            
            if(info.token) {
                localStorage.setItem('token', info.token);
                localStorage.setItem('rol', info.rol); 
                window.location.href = '/dashboard.html';
            } else {
                alert("Datos incorrectos");
            }
        }
    </script>
</body>
</html>
