<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Huerto - Acceso</title>
</head>
<body>
    <h2>Iniciar Sesión</h2>
    <input type="email" id="loginCorreo" placeholder="Correo">
    <input type="password" id="loginPass" placeholder="Contraseña">
    <button onclick="login()">Entrar</button>

    <hr>

    <h2>Registrarse</h2>
    <input type="text" id="regNombre" placeholder="Nombre">
    <input type="email" id="regCorreo" placeholder="Correo">
    <input type="password" id="regPass" placeholder="Contraseña">
    <button onclick="registrar()">Registrar</button>

    <script>
        async function registrar() {
            const data = {
                nombre: document.getElementById('regNombre').value,
                correo: document.getElementById('regCorreo').value,
                password: document.getElementById('regPass').value
            };
            const res = await fetch('/api/registro', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(res.ok) alert("¡Registrado! Ya puedes iniciar sesión.");
            else alert("Error al registrar.");
        }

        async function login() {
            const data = {
                correo: document.getElementById('loginCorreo').value,
                password: document.getElementById('loginPass').value
            };
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const info = await res.json();
            
            if(info.token) {
                // GUARDAMOS TOKEN Y ROL
                localStorage.setItem('token', info.token);
                localStorage.setItem('rol', info.rol); 
                
                // Redirección por rol
                if(info.rol === 'admin') window.location.href = '/admin.html';
                else window.location.href = '/dashboard.html';
            } else {
                alert("Correo o contraseña incorrectos");
            }
        }
    </script>
</body>
</html>
