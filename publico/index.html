<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Huerto - Acceso</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; margin-bottom: 20px; }
        input { width: 90%; margin-bottom: 10px; padding: 8px; }
        button { width: 100%; padding: 10px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Iniciar Sesión</h2>
        <input type="email" id="loginCorreo" placeholder="Correo">
        <input type="password" id="loginPass" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
    </div>

    <div class="box">
        <h2>Registrarse</h2>
        <input type="text" id="regNombre" placeholder="Nombre">
        <input type="email" id="regCorreo" placeholder="Correo">
        <input type="password" id="regPass" placeholder="Contraseña">
        <button onclick="registrar()" style="background: #007bff;">Registrar</button>
    </div>

    <script>
        async function registrar() {
            const data = {
                nombre: document.getElementById('regNombre').value,
                correo: document.getElementById('regCorreo').value,
                password: document.getElementById('regPass').value
            };
            const res = await fetch('/api/registro', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(res.ok) alert("¡Registrado con éxito!");
            else alert("Error al registrar.");
        }

        async function login() {
            const data = {
                correo: document.getElementById('loginCorreo').value,
                password: document.getElementById('loginPass').value
            };
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const info = await res.json();
            
            if(info.token) {
                localStorage.setItem('token', info.token);
                localStorage.setItem('rol', info.rol); 
                window.location.href = '/dashboard.html';
            } else {
                alert("Datos incorrectos");
            }
        }
    </script>
</body>
</html>
