<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Huerto - Acceso</title>
    <style>
        /* Estructura general fluida */
        body { 
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            background-color: #ffffff;
            color: #2e3b27;
        }

        .instagram-layout {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* MITAD IZQUIERDA: Tu ilustración limpia y expandida al 100% */
        .panel-image {
            flex: 1.2; 
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
        }

        .panel-image img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        /* MITAD DERECHA: Fondo blanco limpio */
        .panel-form {
            flex: 0.9; 
            background-color: #ffffff; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Tarjeta en verde huerto ultra suave (combina con la tortuga) */
        .form-card {
            background-color: #f5f8f4; 
            border: 1px solid #e2ebd9;
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(78, 107, 59, 0.05);
            text-align: center;
        }

        /* Título del Huerto */
        .brand-title {
            color: #3b522c; 
            font-size: 2.3rem;
            margin-top: 0;
            margin-bottom: 6px;
            font-weight: bold;
        }

        /* Subtítulo */
        .brand-subtitle {
            color: #657a57; 
            font-size: 0.92rem;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        /* ✨ CUADRO DE MAHAHUAL CON TONO LAVANDA/ROSA VIEJO Y ESPACIO PARA AJOLOTE ✨ */
        .campaign-alert {
            background: #f3e8ee; /* Rosa lavanda pálido que combina con las flores del dibujo */
            border: 1.5px dashed #cbbcc6; /* Borde discontinuo suave */
            border-radius: 14px;
            padding: 16px 55px 16px 14px; /* Espacio a la derecha para que el ajolote no tape las letras */
            margin-bottom: 24px;
            font-size: 0.85rem;
            color: #4a3843; 
            text-align: left;
            line-height: 1.4;
            position: relative; /* Para poder fijar el ajolote en la esquina */
        }

        .campaign-alert h4 {
            margin: 0 0 6px 0;
            color: #8c587c; /* Título morado lavanda */
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }

        /* 📸 TU IMAGEN DE AJOLOTE EN LA ESQUINA DERECHA MARCADA */
        .campaign-axolotl {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 38px;
            height: 38px;
            object-fit: contain;
            pointer-events: none;
        }

        /* Botón de firmas adaptado a la gama lavanda */
        .campaign-btn {
            display: block;
            text-align: center;
            background: #8c587c; 
            color: white !important;
            text-decoration: none;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.82rem;
            transition: background 0.2s;
        }

        .campaign-btn:hover {
            background: #734565;
        }

        /* Inputs estéticos estándar */
        input { 
            width: 100%; 
            margin-bottom: 12px; 
            padding: 13px 12px; 
            border: 1px solid #c5d1bc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.88rem;
            background-color: #ffffff; 
            color: #2e3b27;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: #4e6b3b; 
            box-shadow: 0 0 6px rgba(78, 107, 59, 0.2);
        }

        /* Botón principal Verde Caparazón */
        button { 
            width: 100%; 
            padding: 13px; 
            cursor: pointer; 
            background: #4e6b3b; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 8px;
            margin-bottom: 20px;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(78, 107, 59, 0.2);
        }

        button:hover { 
            background: #3b522c; 
        }

        /* Enlace inferior */
        .switch-form {
            border-top: 1px solid #e1ebd6;
            padding-top: 15px;
            font-size: 0.85rem;
            color: #657a57;
        }

        .switch-link {
            color: #4e6b3b;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            margin-left: 3px;
        }

        .switch-link:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        /* Responsivo Celular */
        @media (max-width: 768px) {
            .panel-image {
                display: none;
            }
            .panel-form {
                flex: 1;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="instagram-layout">
        
        <div class="panel-image">
            <img src="/sorpresa.png?v=15" alt="Proyecto PAEC">
        </div>
        
        <div class="panel-form">
            <div class="form-card">
                <div class="brand-title">🌱 Huertito</div>
                <div id="textoSlogan" class="brand-subtitle">Regístrate para ver las fotos y el progreso de nuestro huerto.</div>

                <div class="campaign-alert">
                    <h4>🚨 ¡SALVEMOS MAHAHUAL!</h4>
                    
                    <img src="/ajolote.png" alt="Ajolote" class="campaign-axolotl">

                    Detengamos el proyecto destructivo de Royal Caribbean que pone en riesgo el segundo arrecife de coral.
                    <a href="https://www.change.org/p/salvemos-mahahual-detengamos-el-proyecto-destructivo-de-royal-caribbean" target="_blank" class="campaign-btn">✍️ FIRMAR PETICIÓN AHORA</a>
                </div>

                <div id="formRegistro" autocomplete="off">
                    <input type="text" id="regNombre" placeholder="Nombre completo" autocomplete="off">
                    <input type="email" id="regCorreo" placeholder="Correo electrónico" autocomplete="off">
                    <input type="password" id="regPass" placeholder="Contraseña" autocomplete="new-password">
                    <button onclick="registrar()">Registrarte</button>
                    
                    <div class="switch-form">
                        ¿Tienes una cuenta? <span class="switch-link" onclick="mostrarLogin()">Iniciar sesión</span>
                    </div>
                </div>

                <div id="formLogin" class="hidden" autocomplete="off">
                    <input type="email" id="loginCorreo" placeholder="Correo electrónico" autocomplete="username">
                    <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
                    <button onclick="login()">Entrar</button>
                    
                    <div class="switch-form">
                        ¿No tienes una cuenta? <span class="switch-link" onclick="mostrarRegistro()">Regístrate</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function mostrarLogin() {
            document.getElementById('formRegistro').classList.add('hidden');
            document.getElementById('formLogin').classList.remove('hidden');
            document.getElementById('textoSlogan').innerText = 'Ingresa para gestionar y monitorear tus plantas.';
        }

        function mostrarRegistro() {
            document.getElementById('formLogin').classList.add('hidden');
            document.getElementById('formRegistro').classList.remove('hidden');
            document.getElementById('textoSlogan').innerText = 'Regístrate para ver las fotos y el progreso de nuestro huerto.';
        }

        async function registrar() {
            const correoInput = document.getElementById('regCorreo').value;
            const passInput = document.getElementById('regPass').value;
            const data = {
                nombre: document.getElementById('regNombre').value,
                correo: correoInput,
                password: passInput
            };
            const res = await fetch('/api/registro', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            if(res.ok) {
                alert("¡Registrado con éxito! Entrando al huerto...");
                const loginRes = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ correo: correoInput, password: passInput })
                });
                const info = await loginRes.json();
                
                if(info.token) {
                    localStorage.setItem('token', info.token);
                    localStorage.setItem('rol', info.rol); 
                    window.location.href = '/dashboard.html';
                } else {
                    mostrarLogin();
                }
            } else {
                alert("Error al registrar.");
            }
        }

        async function login() {
            const data = {
                correo: document.getElementById('loginCorreo').value,
                password: document.getElementById('loginPass').value
            };
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const info = await res.json();
            
            if(info.token) {
                localStorage.setItem('token', info.token);
                localStorage.setItem('rol', info.rol); 
                window.location.href = '/dashboard.html';
            } else {
                alert("Datos incorrectos");
            }
        }
    </script>
</body>
</html>
