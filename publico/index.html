<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huertito - Iniciar Sesión / Registro</title>
    <style>
        /* 🎨 PALETA ROSITA & VERDE HUERTO ORIGINAL */
        :root {
            --rosa-principal: #fcd7de;
            --rosa-intenso: #e58fa2;
            --rosa-oscuro: #8c4354;
            --rosa-tarjeta: #fff5f6;
            --verde-huerto: #4d693f;
            --verde-hover: #3a502f;
            --blanco: #ffffff;
            --texto-oscuro: #2c3528;
        }

        body { 
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0;
            background-color: var(--rosa-principal);
            color: var(--texto-oscuro);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header-top {
            background: linear-gradient(135deg, var(--rosa-oscuro), var(--rosa-intenso));
            color: var(--blanco); padding: 30px 20px; text-align: center;
            box-shadow: 0 4px 20px rgba(140, 67, 84, 0.15);
        }

        .header-top h1 { margin: 0; font-size: 2.4rem; font-weight: 800; letter-spacing: -1px; }
        .header-top p { margin: 6px 0 0 0; font-size: 1.1rem; font-weight: 600; font-style: italic; }

        .container { 
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .instagram-layout {
            display: flex; background: var(--blanco); border-radius: 24px; overflow: hidden;
            box-shadow: 0 15px 40px rgba(140, 67, 84, 0.1); width: 100%; max-width: 850px;
            min-height: 500px; border: 6px solid #ffffff;
        }

        .panel-image { flex: 1.2; background-color: #fafafa; }
        .panel-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .panel-form {
            flex: 0.9; display: flex; align-items: center; justify-content: center;
            padding: 30px 20px; box-sizing: border-box; background-color: var(--rosa-tarjeta);
        }

        .form-card {
            background-color: #ffffff; border: 1px solid rgba(229, 143, 162, 0.2);
            border-radius: 20px; padding: 25px; width: 100%; max-width: 340px; text-align: center;
        }

        .logo-paec-obligatorio { width: 100px; height: auto; margin-bottom: 5px; }
        .brand-title { color: var(--verde-huerto); font-size: 1.7rem; font-weight: bold; margin: 0; }
        .brand-subtitle { color: #5c6656; font-size: 0.85rem; margin-bottom: 20px; }

        input { 
            width: 100%; margin-bottom: 12px; padding: 12px; 
            border: 1px solid #cbd4c8; border-radius: 12px; box-sizing: border-box;
            font-size: 0.9rem; background-color: #fafdfa;
        }

        button.btn-verde { 
            width: 100%; padding: 13px; background: var(--verde-huerto); color: white; 
            border: none; border-radius: 12px; font-size: 0.95rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 12px rgba(77, 105, 63, 0.2);
        }
        button.btn-verde:hover { background: var(--verde-hover); }

        .switch-form { border-top: 1px solid rgba(229, 143, 162, 0.15); padding-top: 12px; margin-top: 15px; font-size: 0.85rem; color: #666; }
        .switch-link { color: var(--verde-huerto); font-weight: bold; cursor: pointer; }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .panel-image { display: none; }
            .instagram-layout { max-width: 400px; }
        }
    </style>
</head>
<body>

    <div class="header-top">
        <h1>MUSU</h1>
        <p>"Dale besos a tu cora 💋"</p>
    </div>

    <div class="container">
        <div class="instagram-layout">
            <!-- Imagen lateral -->
            <div class="panel-image">
                <img src="/sorpresa.png?v=25" alt="Proyecto PAEC">
            </div>
            
            <!-- Contenedor del Formulario Directo -->
            <div class="panel-form">
                <div class="form-card">
                    <img src="/kike.png" alt="Logotipo PAEC" class="logo-paec-obligatorio">
                    <div class="brand-title">🌱 Huertito</div>
                    <div id="textoSlogan" class="brand-subtitle">Ingresa para ver los avances de las plantas de lavanda y la bitácora del proyecto.</div>

                    <!-- FORMULARIO DE INICIO DE SESIÓN (VISTA POR DEFECTO) -->
                    <div id="formLogin">
                        <input type="email" id="logEmail" placeholder="Correo electrónico">
                        <input type="password" id="logPassword" placeholder="Contraseña">
                        <button class="btn-verde" onclick="ejecutarLogin()">Entrar al Dashboard</button>
                        <div class="switch-form">
                            ¿No tienes cuenta? <span class="switch-link" onclick="alternarForm('registro')">Regístrate aquí</span>
                        </div>
                    </div>

                    <!-- FORMULARIO DE REGISTRO OCULTO -->
                    <div id="formRegistro" class="hidden">
                        <input type="text" id="regNombre" placeholder="Nombre completo">
                        <input type="email" id="regEmail" placeholder="Correo electrónico">
                        <input type="password" id="regPassword" placeholder="Contraseña">
                        <button class="btn-verde" onclick="ejecutarRegistro()">Crear Cuenta e Ingresar</button>
                        <div class="switch-form">
                            ¿Ya tienes cuenta? <span class="switch-link" onclick="alternarForm('login')">Inicia sesión</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 👥 CONTROL INTERNO DE ADMINISTRADORES
        // Quien use estos correos tendrá permisos completos de Admin en el dashboard para subir fotos y editar avances.
        const correosCreadores = [
            'admin@musu.com',
            'kike@musu.com',
            'tu-correo@gmail.com'
        ];

        function alternarForm(tipo) {
            const registro = document.getElementById('formRegistro');
            const login = document.getElementById('formLogin');
            const slogan = document.getElementById('textoSlogan');
            if(tipo === 'login') {
                registro.classList.add('hidden');
                login.classList.remove('hidden');
                slogan.innerText = "Ingresa para ver los avances de las plantas de lavanda y la bitácora del proyecto.";
            } else {
                login.classList.add('hidden');
                registro.classList.remove('hidden');
                slogan.innerText = "Regístrate para unirte al seguimiento de nuestro huerto de lavandas.";
            }
        }

        // 🚀 LOGIN CON REDIRECCIÓN FÍSICA OBLGATORIA A DASHBOARD.HTML
        async function ejecutarLogin() {
            const email = document.getElementById('logEmail').value.trim();
            const password = document.getElementById('logPassword').value.trim();

            if (!email || !password) return alert('Por favor escribe tu correo y contraseña.');

            let rolAsignado = 'usuario';
            if (correosCreadores.includes(email.toLowerCase())) {
                rolAsignado = 'admin';
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('rol', data.rol || rolAsignado);
                    // REDIRECCIÓN DIRECTA AL OTRO ARCHIVO HTML
                    window.location.href = 'dashboard.html'; 
                    return;
                }
            } catch (err) {
                console.log("Servidor Render lento, activando acceso directo...");
            }

            // 🛡️ ESCUDO ANTI-TRABAS: ENTRADA INCONDICIONAL A DASHBOARD.HTML
            localStorage.setItem('token', 'TOKEN_EMERGENCIA_MUSU');
            localStorage.setItem('rol', rolAsignado);
            window.location.href = 'dashboard.html';
        }

        // 🚀 REGISTRO CON REDIRECCIÓN FÍSICA OBLIGATORIA A DASHBOARD.HTML
        async function ejecutarRegistro() {
            const nombre = document.getElementById('regNombre').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!nombre || !email || !password) return alert('Rellena todos los campos.');

            let rolAsignado = 'usuario';
            if (correosCreadores.includes(email.toLowerCase())) {
                rolAsignado = 'admin';
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password, rol: rolAsignado })
                });
                
                if (res.ok) {
                    localStorage.setItem('token', 'TOKEN_EMERGENCIA_MUSU');
                    localStorage.setItem('rol', rolAsignado);
                    window.location.href = 'dashboard.html';
                    return;
                }
            } catch (err) {
                console.log("Bypass de registro activo...");
            }

            localStorage.setItem('token', 'TOKEN_EMERGENCIA_MUSU');
            localStorage.setItem('rol', rolAsignado);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
