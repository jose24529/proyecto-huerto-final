<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administrador</title>
</head>
<body>
    <h2>Panel de Control - Administrador</h2>
    
    <h3>Subir Imagen a la Galería</h3>
    <input type="file" id="imagenInput" accept="image/*">
    <button onclick="subirImagen()">Subir Imagen</button>

    <script>
        const token = localStorage.getItem('token');
        const rol = localStorage.getItem('rol');

        // Seguridad: Si no es admin, lo echamos
        if(!token || rol !== 'admin') {
            alert('Área exclusiva para administradores.');
            window.location.href = '/';
        }

        async function subirImagen() {
            const input = document.getElementById('imagenInput');
            if(input.files.length === 0) return alert("Elige una foto.");

            const formData = new FormData();
            formData.append('imagen', input.files[0]);

            const res = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            alert('Imagen subida en: ' + data.imageUrl);
        }
    </script>
</body>
</html>
