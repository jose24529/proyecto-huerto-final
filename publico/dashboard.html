<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bitácora del Huerto</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        #seccionAdmin { display: none; background: #e8f5e9; padding: 20px; border-radius: 10px; margin-bottom: 30px; border: 1px solid #c8e6c9; }
        .campo { margin-bottom: 10px; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; }
        .entrada { border-bottom: 2px solid #eee; padding: 20px 0; }
        .entrada img { max-width: 100%; border-radius: 8px; margin-top: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .logout { float: right; color: red; cursor: pointer; }
    </style>
</head>
<body>
    <span class="logout" onclick="localStorage.clear(); location.href='/'">Cerrar Sesión</span>
    <h1>🌱 Historial del Huerto</h1>

    <div id="seccionAdmin">
        <h2>Nueva Entrada (Panel Admin)</h2>
        <div class="campo"><input type="text" id="tipoPlanta" placeholder="Nombre de la planta"></div>
        <div class="campo"><input type="number" id="altura" placeholder="Altura (cm)"></div>
        <div class="campo"><input type="text" id="abono" placeholder="Tipo de abono usado"></div>
        <div class="campo"><textarea id="obs" placeholder="Observaciones generales..."></textarea></div>
        <div class="campo"> Foto: <input type="file" id="imagenHuerto"></div>
        <button onclick="guardar()" style="background: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Publicar Cambio</button>
    </div>

    <div id="contenedorBitacora">Cargando registros...</div>

    <script>
        const token = localStorage.getItem('token');
        const rol = localStorage.getItem('rol');

        if(!token) window.location.href = '/';

        // Si es admin, mostramos el formulario
        if(rol === 'admin') {
            document.getElementById('seccionAdmin').style.display = 'block';
        }

        async function cargarDatos() {
            const res = await fetch('/api/bitacora');
            const registros = await res.json();
            const contenedor = document.getElementById('contenedorBitacora');
            contenedor.innerHTML = '';

            registros.forEach(reg => {
                contenedor.innerHTML += `
                    <div class="entrada">
                        <small>${new Date(reg.fecha).toLocaleString()}</small>
                        <h3>🌿 ${reg.tipoPlanta}</h3>
                        <p><strong>Crecimiento:</strong> ${reg.altura} cm | <strong>Abono:</strong> ${reg.abono || 'N/A'}</p>
                        <p><strong>Notas:</strong> ${reg.observaciones}</p>
                        ${reg.imagenUrl ? `<img src="${reg.imagenUrl}">` : ''}
                    </div>
                `;
            });
        }

        async function guardar() {
            const formData = new FormData();
            formData.append('tipoPlanta', document.getElementById('tipoPlanta').value);
            formData.append('altura', document.getElementById('altura').value);
            formData.append('abono', document.getElementById('abono').value);
            formData.append('observaciones', document.getElementById('obs').value);
            const foto = document.getElementById('imagenHuerto').files[0];
            if(foto) formData.append('imagen', foto);

            const res = await fetch('/api/bitacora', { method: 'POST', body: formData });
            if(res.ok) {
                alert("¡Guardado!");
                document.querySelectorAll('input, textarea').forEach(i => i.value = '');
                cargarDatos();
            }
        }

        cargarDatos();
    </script>
</body>
</html>
