<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bitácora del Huerto</title>
    <style>
        /* Estructura general con el color crema/verde muy suave de fondo */
        body { 
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f7f2; /* Integrado con las ilustraciones */
            color: #2e3b27;
            min-height: 100vh;
        }
        
        /* Contenedor flexible que expande la pantalla al 100% para dar espacio a los lados */
        .dashboard-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            width: 100%;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        /* Bloque central del formulario y entradas */
        .main-content {
            flex: 1;
            max-width: 760px; /* Tamaño ideal para que no se vea gigante y queden los huecos laterales */
            z-index: 2; 
        }
        
        /* 🦎 AJOLOTES FLOTANTES EN LOS ESPACIOS EN BLANCO 🦎 */
        .axolotl-side {
            position: fixed;
            top: 15%;
            width: 250px;
            height: auto;
            pointer-events: none; /* Permite hacer clic "a través" de ellos si fuera necesario */
            user-select: none;
        }

        /* Ajolote izquierdo (ajolote2.jpg) */
        .axolotl-left {
            left: 30px;
        }

        /* Ajolote derecho (ajolote1.jpg) */
        .axolotl-right {
            right: 30px;
        }
        
        /* Enlace de Cerrar Sesión estilizado con el color morado lavanda */
        .logout { 
            float: right; 
            color: #785880; 
            cursor: pointer; 
            font-weight: bold; 
            text-decoration: none;
            font-size: 0.95rem;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(120, 88, 128, 0.2);
            background: #ffffff;
            transition: all 0.2s;
        }
        .logout:hover { 
            background: #f1ebf2;
            border-color: #785880;
        }
        
        h1 { 
            color: #557a46; /* Verde musgo de los ajolotes */
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Sección del Panel de Administración */
        #seccionAdmin { 
            display: none; 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 16px; 
            margin-bottom: 35px; 
            border: 1px solid #dbe3da; 
            box-shadow: 0 8px 24px rgba(85, 122, 70, 0.05); 
        }

        #seccionAdmin h2 {
            margin-top: 0;
            color: #405d33;
            font-size: 1.35rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #eef3ed;
            padding-bottom: 8px;
        }

        .campo { 
            margin-bottom: 16px; 
        }
        
        label { 
            font-weight: 600; 
            display: block; 
            margin-bottom: 6px; 
            color: #557a46; 
            font-size: 0.9rem;
        }
        
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #c0cca9; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 0.95rem;
            background-color: #fafbfa;
            color: #2e3b27;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #557a46;
            background-color: #ffffff;
            box-shadow: 0 0 6px rgba(85, 122, 70, 0.2);
        }

        input[type="file"] {
            background: #fafbfa;
            border: 1px dashed #b1c295;
            padding: 10px;
            cursor: pointer;
        }

        /* Botón con el verde musgo principal */
        button { 
            background: #557a46; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: bold; 
            width: 100%; 
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(85, 122, 70, 0.2);
            margin-top: 10px;
        }
        button:hover { 
            background: #405d33; 
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }

        #contenedorBitacora {
            margin-top: 20px;
        }

        /* Tarjetas de publicaciones individuales */
        .entrada { 
            background: white; 
            border: 1px solid #dbe3da; 
            padding: 25px; 
            margin-bottom: 25px; 
            border-radius: 16px; 
            box-shadow: 0 6px 18px rgba(0,0,0,0.02); 
            transition: transform 0.2s;
        }
        .entrada:hover {
            transform: translateY(-2px);
        }

        .entrada h3 {
            margin: 10px 0;
            color: #405d33;
            font-size: 1.4rem;
        }

        .entrada p {
            margin: 8px 0;
            line-height: 1.5;
            color: #3a4733;
        }

        /* Pequeñas etiquetas moradas lavanda */
        .badge {
            background-color: #f1ebf2; 
            color: #785880; 
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            display: inline-block;
            border: 1px solid rgba(120, 88, 128, 0.15);
        }

        .entrada img { 
            max-width: 100%; 
            border-radius: 12px; 
            margin-top: 18px; 
            display: block; 
            box-shadow: 0 6px 18px rgba(0,0,0,0.06); 
        }

        .no-registros {
            text-align: center;
            color: #5c7050;
            background: white;
            padding: 45px;
            border-radius: 16px;
            border: 1px dashed #785880;
        }

        /* Si abren la página en una tablet o celular, quitamos los ajolotes para que no tapen el contenido */
        @media (max-width: 1200px) {
            .axolotl-side {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <img src="/ajolote2.png" alt="Ajolote Izquierdo" class="axolotl-side axolotl-left">
    <img src="/ajolote1.png" alt="Ajolote Derecho" class="axolotl-side axolotl-right">

    <div class="dashboard-layout">
        <div class="main-content">
            <span class="logout" onclick="localStorage.clear(); location.href='/'">Cerrar Sesión</span>
            <h1>🌱 Historial del Huerto</h1>

            <div id="seccionAdmin">
                <h2>Nueva Entrada (Panel Admin)</h2>
                <div class="campo">
                    <label>Planta:</label>
                    <input type="text" id="tipoPlanta" placeholder="Ej. Tomate, Albahaca...">
                </div>
                <div class="campo">
                    <label>Altura (cm):</label>
                    <input type="number" id="altura" placeholder="Ej. 15">
                </div>
                <div class="campo">
                    <label>Abono:</label>
                    <input type="text" id="abono" placeholder="Ej. Compost orgánico">
                </div>
                <div class="campo">
                    <label>Observaciones:</label>
                    <textarea id="obs" rows="3" placeholder="¿Cómo se ve la planta hoy?"></textarea>
                </div>
                <div class="campo">
                    <label>Foto del progreso:</label>
                    <input type="file" id="imagenHuerto" accept="image/*">
                </div>
                <button onclick="guardarBitacora()">Publicar en Bitácora</button>
            </div>

            <div id="contenedorBitacora">Cargando registros...</div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const rol = localStorage.getItem('rol');

        // Protección de ruta obligatoria
        if(!token) window.location.href = '/';

        // Mostrar sección de subida solo si el rol guardado es exactamente 'admin'
        if(rol === 'admin') {
            document.getElementById('seccionAdmin').style.display = 'block';
        }

        // Cargar las entradas guardadas desde la base de datos
        async function cargarDatos() {
            try {
                const res = await fetch('/api/bitacora');
                const registros = await res.json();
                const contenedor = document.getElementById('contenedorBitacora');
                
                if (registros.length === 0) {
                    contenedor.innerHTML = `
                        <div class="no-registros">
                            <p style="font-size: 1.1rem; margin: 0; font-weight: bold; color: #405d33;">No hay registros aún.</p>
                            <p style="color: #785880; font-size: 0.92rem; margin-top: 6px; font-weight: 500;">¡El administrador debe subir la primera planta!</p>
                        </div>
                    `;
                    return;
                }

                contenedor.innerHTML = '';
                registros.forEach(reg => {
                    contenedor.innerHTML += `
                        <div class="entrada">
                            <small style="color: #785880; font-weight: 600;">📅 ${new Date(reg.fecha).toLocaleString()}</small>
                            <h3>🌿 ${reg.tipoPlanta}</h3>
                            <p>
                                <strong>Crecimiento:</strong> <span class="badge">📐 ${reg.altura} cm</span> 
                                | <strong>Abono:</strong> <span class="badge">🧬 ${reg.abono || 'No especificado'}</span>
                            </p>
                            <p style="margin-top: 12px;"><strong>Notas:</strong> ${reg.observaciones}</p>
                            ${reg.imagenUrl ? `<img src="${reg.imagenUrl}" alt="Foto del huerto">` : '<p style="color: #8fa087; font-style: italic; margin-top: 15px;">Sin imagen adjunta</p>'}
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar datos:", error);
                document.getElementById('contenedorBitacora').innerText = 'Error al conectar con el historial.';
            }
        }

        // Guardar un nuevo registro de planta en la bitácora
        async function guardarBitacora() {
            const formData = new FormData();
            formData.append('tipoPlanta', document.getElementById('tipoPlanta').value);
            formData.append('altura', document.getElementById('altura').value);
            formData.append('abono', document.getElementById('abono').value);
            formData.append('observaciones', document.getElementById('obs').value); 

            const archivo = document.getElementById('imagenHuerto').files[0];
            if (archivo) {
                formData.append('imagen', archivo); 
            }

            try {
                const res = await fetch('/api/bitacora', {
                    method: 'POST',
                    body: formData 
                });

                if(res.ok) {
                    alert('¡Excelente! Registro y foto guardados correctamente.');
                    location.reload(); 
                } else {
                    const errorData = await res.json();
                    alert('Error: ' + (errorData.error || 'No se pudo subir'));
                }
            } catch (error) {
                console.error("Error en la petición:", error);
                alert('Error de conexión con el servidor.');
            }
        }

        // Ejecutar carga automática al abrir la pantalla
        cargarDatos();
    </script>
</body>
</html>
